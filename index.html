<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Hanchong Chen" />
    <title>Hanchong Chen</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #fafafa;
        color: #151515;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 4.5rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111;
          color: #f5f5f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hanchong Chen</h1>
    </main>
  </body>
</html>
