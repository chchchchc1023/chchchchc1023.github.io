<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Hanchong Chen" />
    <title>Hanchong Chen</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #fafafa;
        color: #151515;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 4.5rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      main {
        text-align: center;
      }

      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: inherit;
        font-size: clamp(0.95rem, 2.5vw, 1.1rem);
        line-height: 1.5;
        text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
        text-underline-offset: 0.25em;
      }

      a:hover,
      a:focus-visible {
        text-decoration-color: currentColor;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111;
          color: #f5f5f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hanchong Chen</h1>
      <a href="mailto:hanchongchen.cs@gmail.com">hanchongchen.cs@gmail.com</a>
    </main>
  </body>
</html>
